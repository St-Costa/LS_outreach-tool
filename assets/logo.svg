<svg width="380" height="120" viewBox="0 0 380 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="L&S Outreach Tool - CRM">
  <!-- Scheda contatto (CRM) -->
  <rect x="14" y="20" width="80" height="80" rx="12" fill="#0e1117" stroke="#30363d" stroke-width="2.5"/>
  <!-- Avatar contatto -->
  <circle cx="40" cy="45" r="9" fill="#4f8cff"/>
  <path d="M27 66 C27 55, 53 55, 53 66 Z" fill="#4f8cff"/>
  <!-- Righe dati contatto -->
  <line x1="62" y1="40" x2="82" y2="40" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="50" x2="78" y2="50" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>

  <!-- Pipeline a stadi: da_contattare -> ... -> accettata -->
  <line x1="24" y1="82" x2="84" y2="82" stroke="#30363d" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="82" r="4.5" fill="#8b949e"/>
  <circle cx="44" cy="82" r="4.5" fill="#5b7cff"/>
  <circle cx="64" cy="82" r="4.5" fill="#4f8cff"/>
  <circle cx="84" cy="82" r="5.5" fill="#3fb950"/>

  <!-- Wordmark -->
  <text x="118" y="58" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e6edf3">
    L<tspan fill="#4f8cff">&amp;</tspan>S
  </text>
  <text x="119" y="86" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="3.5" fill="#8b949e">
    OUTREACH CRM
  </text>
</svg>
