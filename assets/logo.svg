<svg width="360" height="120" viewBox="0 0 360 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="L&S Outreach Tool">
  <!-- Emblema: nodo centrale con connessioni di outreach -->
  <g stroke="#4f8cff" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="60" x2="24" y2="30"/>
    <line x1="60" y1="60" x2="24" y2="90"/>
    <line x1="60" y1="60" x2="96" y2="30"/>
    <line x1="60" y1="60" x2="96" y2="90"/>
  </g>
  <g fill="#4f8cff">
    <circle cx="24" cy="30" r="7"/>
    <circle cx="24" cy="90" r="7"/>
    <circle cx="96" cy="30" r="7"/>
    <circle cx="96" cy="90" r="7"/>
  </g>
  <circle cx="60" cy="60" r="14" fill="#0e1117" stroke="#7db0ff" stroke-width="3"/>

  <!-- Wordmark -->
  <text x="132" y="58" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e6edf3">
    L<tspan fill="#4f8cff">&amp;</tspan>S
  </text>
  <text x="133" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="4" fill="#8b949e">
    OUTREACH TOOL
  </text>
</svg>
